name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: offline_processing/requirements.txt
      - name: Install analysis dependencies
        run: python -m pip install -r offline_processing/requirements.txt
      - name: Run synthetic regression tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s offline_processing -p "test_*.py" -v
      - name: Check notebook syntax and publication format
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          for path in Path("offline_processing").glob("*.ipynb"):
              notebook = json.loads(path.read_text(encoding="utf-8"))
              for index, cell in enumerate(notebook["cells"]):
                  if cell["cell_type"] == "code":
                      assert not cell.get("outputs"), f"{path}: clear cell {index} outputs before publishing"
                      assert cell.get("execution_count") is None, f"{path}: clear execution counts"
                      ast.parse("".join(cell["source"]), filename=f"{path}:cell{index}")
          PY
